    <style>

.card-container {
   display: flex;
   flex-wrap: wrap; 
   gap: 50px;
   justify-content: center;
 
}


.card {
    border: 2px solid rgba(128, 0, 128, 0.422);
    height: 400px;
    width: 500px;
    border-radius: 10px;
    box-shadow: 0 8px 10px rgba(0, 0, 0, 0.15);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;

}

.card-image {
    
    display: flex;
    justify-content: center;
    align-items: center;
    
     
}



.card-image img {
    width: 100%;
     height: 150px;
     border: 2px solid transparent;
  position: relative;
  top: 20px;
     /* border-radius: 50%; */
  background: 
    linear-gradient(white, white) padding-box, 
    linear-gradient(to right, #ff4e50, #40c0cb) border-box;

}




.card-content{
    /* display: flex; */
    /* justify-content: center; */
    text-align: center;
    padding: 15px;
    margin: 10px;
    
}

.btns{
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 20px 0 0 0;


}




.card-btn {
    padding: 8px 16px;
    width: 140px;
    height: 35px;
    border: 1.5px solid #111;
    border-radius: 6px;
    background: #fff;
    color: #000000;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;

}


.card-btn:hover {
    background: rgb(236, 231, 231);
    color: #111;
    transform: translateY(-2px);
}



h1{
    text-align: center;
}

    </style>
